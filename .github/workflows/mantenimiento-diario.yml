# Corre todos los días a las 8:00 de Argentina (11:00 UTC).
# 1) Pasa al Histórico las vencidas hace más de N días.
# 2) Mantiene activo el proyecto gratuito de Supabase (se pausa tras 7 días sin uso).
# La clave anon es pública por diseño (va dentro de la app); los datos los protegen el login y las reglas de acceso.
name: Mantenimiento diario
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}
jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a mantenimiento()
        env:
          URL: https://igkxnflpwhlumdoarfwr.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlna3huZmxwd2hsdW1kb2FyZndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MjQ1NjQsImV4cCI6MjEwOTMwMDU2NH0.kgqoaY-UGJYXfnUaICrNuWHN0T5aqyKlkY-ygboRUf8
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/mantenimiento" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
